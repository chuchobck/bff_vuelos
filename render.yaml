# Blueprint de Render para el BFF (https://render.com/docs/blueprint-spec). Lo que cambia entre
# entornos va con sync: false: Render lo pide al crear el servicio y nunca está en este archivo.
# Guía paso a paso: docs/DEPLOY.md
services:
  - type: web
    name: quinde-vuelos-bff
    runtime: node
    plan: free
    # NODE_ENV=production también rige en el build y npm ci omitiría las devDependencies
    # (@nestjs/cli, typescript): --include=dev las instala para compilar.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      # El core en Render no expone gRPC (solo el puerto HTTP): hasta la fase Azure, el BFF le
      # habla por REST. Con gRPC: CORE_TRANSPORT=grpc y CORE_GRPC_URL=<host>:50051
      - key: CORE_TRANSPORT
        value: rest
      - key: CORE_REST_URL
        value: https://quinde-vuelos-api.onrender.com
      # Render pone un proxy delante: con 1 la IP del cliente sale de X-Forwarded-For
      - key: TRUST_PROXY
        value: '1'
      # Observabilidad (docs/OBSERVABILIDAD.md del gateway). En un contenedor, el puerto de métricas es
      # el 9464 y el ingress de Render nunca lo expone. Para exportar trazas, agrega
      # OTEL_EXPORTER_OTLP_ENDPOINT en el panel (docs/DEPLOY.md).
      - key: OTEL_SERVICE_NAME
        value: quinde-bff
      - key: TRACE_TRUST_INCOMING
        value: 'true'
      - key: METRICS_PORT
        value: '9464'
      # Orígenes del marketplace separados por coma (https://app.example.com), o vacía
      - key: CORS_ORIGINS
        sync: false
